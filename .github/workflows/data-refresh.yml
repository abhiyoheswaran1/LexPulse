name: Data refresh (daily)

# Short, checkpointed refresh for sources that should not wait for the
# quarterly CourtListener bulk cycle. This keeps source data moving even when
# larger weekly backfills time out.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "CourtListener lookback window in days"
        required: false
        default: "14"
      limit:
        description: "Max CourtListener dockets to fetch"
        required: false
        default: "3000"

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Import SEC company master
        run: npm run import:company-master

      - name: Fetch recent CourtListener dockets
        run: npm run fetch:courtlistener -- --out /tmp/dockets-refresh.jsonl --days ${{ github.event.inputs.days || '14' }} --limit ${{ github.event.inputs.limit || '3000' }}

      - name: Ingest recent dockets
        run: npm run ingest -- --file /tmp/dockets-refresh.jsonl --batch 500

      - name: Enrich parties and match entities
        run: |
          npm run fetch:courtlistener-parties -- --limit 25
          npm run match:entities -- --limit 5000

      - name: Fetch free external event sources
        run: npm run fetch:external-events -- --source all --limit 100

      - name: Extract case outcomes
        run: npm run extract:case-outcomes -- --limit 3000

      - name: Refresh sectors, judges, and risk
        run: |
          npm run seed:sectors
          npm run expand:sectors
          npm run seed:judges
          npm run risk
